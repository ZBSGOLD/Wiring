<!DOCTYPE html><html lang="ur" dir="rtl"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZBS GOLD - Genuine Parts</title><style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    min-height: 100%;
    overflow-x: hidden;
}

body {
    font-family: Arial, sans-serif;
    background: #D4AF37;
}

/* =========================
   CIRCULAR LOADING SCREEN
========================== */

#loader {
    position: fixed;
    inset: 0;
    background: #202326;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 99999;
    transition: opacity 0.6s ease, visibility 0.6s ease;
}

#loader.hide {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
}

.loader-circle {
    width: 145px;
    height: 145px;
    border-radius: 50%;
    border: 5px solid #66521F;
    border-top-color: #F5D76E;
    border-right-color: #D4AF37;
    display: flex;
    justify-content: center;
    align-items: center;
    animation: loaderSpin 1.2s linear infinite;
    box-shadow: 0 0 15px rgba(212, 175, 55, 0.2);
}

.loader-text {
    position: absolute;
    text-align: center;
    pointer-events: none;
}

.loader-text .zbs {
    font-size: 35px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #F5D76E;
    text-shadow: 2px 2px 0 #8B6914;
}

.loader-text .gold {
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #D4AF37;
    margin-top: 2px;
}

@keyframes loaderSpin {
    to {
        transform: rotate(360deg);
    }
}

/* =========================
   LOADING BAR
========================== */

.loader-bottom {
    position: absolute;
    bottom: 75px;
    left: 0;
    width: 100%;
    padding: 0 35px;
    text-align: center;
}

.loader-label {
    color: #F5D76E;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 2px;
    margin-bottom: 12px;
}

.loader-bar {
    width: 100%;
    max-width: 260px;
    height: 5px;
    background: #66521F;
    border-radius: 10px;
    overflow: hidden;
    margin: auto;
}

.loader-progress {
    width: 0%;
    height: 100%;
    background: linear-gradient(
        90deg,
        #B8860B,
        #F5D76E,
        #D4AF37
    );
    border-radius: 10px;
    animation: loadingProgress 3s linear forwards;
}

@keyframes loadingProgress {
    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}

/* =========================
   MAIN PAGE
========================== */

.page {
    min-height: 100vh;
    min-height: 100dvh;
    background: linear-gradient(
        135deg,
        #F5D76E 0%,
        #D4AF37 45%,
        #B8860B 100%
    );
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
}

/* Black space above header */

.page::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 100px;
    background: #202326;
    z-index: 0;
    pointer-events: none;
}

/* Header */

.header {
    background: #202326;
    color: #D4AF37;
    padding: 30px 15px 45px;
    margin-top: 60px;
    text-align: center;
    position: relative;
    border-bottom: 6px solid #D4AF37;
    flex-shrink: 0;

    clip-path: polygon(
        0 0,
        100% 0,
        100% 83%,
        50% 100%,
        0 83%
    );
}

/* Move header text only */

.header .brand,
.header .gold-text,
.header .tagline {
    position: relative;
    top: -18px;
}

/* ZBS */

.brand {
    font-size: clamp(38px, 10vw, 55px);
    font-weight: 900;
    letter-spacing: 5px;
    line-height: 1.1;
    color: #F5D76E;
    text-shadow: 2px 2px 0 #8B6914;
}

/* GOLD */

.gold-text {
    font-size: 24px;
    font-weight: bold;
    color: #D4AF37;
    margin-top: 5px;
    letter-spacing: 4px;
}

/* Tagline */

.tagline {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1.5px;
    margin-top: 6px;
    color: #F5D76E;
}

/* Main content */

.content {
    text-align: center;
    padding: 12px 10px 15px;
    color: #202326;
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    z-index: 1;
}

/* Message box */

.message-box {
    background: #FFFDF5;
    border: 4px solid #202326;
    border-radius: 24px;
    padding: 95px 8px 85px;
    min-height: 0;
    height: auto;
    max-width: 380px;
    width: 100%;
    margin: 0 auto;
    box-shadow: 0 4px 0 #8B6914;
}

/* Urdu message */

.message {
    font-family:
        "Noto Nastaliq Urdu",
        "Noto Naskh Arabic",
        serif;
    font-size: clamp(24px, 6vw, 36px);
    font-weight: 400;
    line-height: 1.5;
    color: #171717;
}

/* Product image */

.logo {
    width: 220px;
    max-width: 100%;
    max-height: 28vh;
    height: auto;
    object-fit: contain;
    display: block;
    margin: 5px auto 0;
    pointer-events: none;
}

/* Golden divider */

.divider {
    width: 100px;
    height: 5px;
    background: linear-gradient(
        90deg,
        #B8860B,
        #F5D76E,
        #B8860B
    );
    border: 1px solid #8B6914;
    border-radius: 5px;
    margin: 5px auto 0;
}

/* Footer */

.footer {
    background: #202326;
    color: #D4AF37;
    text-align: center;
    padding: 10px 8px;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 1px;
    border-top: 3px solid #8B6914;
    flex-shrink: 0;
    position: relative;
    z-index: 1;
}

.product-line {
    margin-top: 4px;
    color: #F5D76E;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 1px;
}

/* Small mobile screens */

@media (max-width: 380px) {

    .header {
        padding: 12px 8px 25px;
    }

    .brand {
        font-size: 38px;
    }

    .gold-text {
        font-size: 21px;
    }

    .tagline {
        font-size: 10px;
    }

    .content {
        padding: 8px 10px 10px;
    }

    .message-box {
        padding: 35px 6px 25px;
        min-height: 0;
        height: auto;
    }

    .message {
        font-size: 25px;
        line-height: 1.4;
    }

    .logo {
        width: 190px;
        max-height: 24vh;
    }

    .footer {
        padding: 8px 5px;
        font-size: 10px;
    }

    .product-line {
        font-size: 11px;
    }
}

/* Short screens */

@media (max-height: 380px) {

    .header {
        padding-top: 8px;
        padding-bottom: 22px;
    }

    .brand {
        font-size: 36px;
    }

    .gold-text {
        font-size: 20px;
        margin-top: 3px;
    }

    .tagline {
        margin-top: 4px;
        font-size: 10px;
    }

    .content {
        padding-top: 6px;
        padding-bottom: 8px;
    }

    .message-box {
        padding-top: 20px;
        padding-bottom: 20px;
    }

    .message {
        font-size: 24px;
        line-height: 1.35;
    }

    .logo {
        max-height: 20vh;
    }

    .footer {
        padding-top: 6px;
        padding-bottom: 6px;
    }

    .loader-bottom {
        bottom: 20px;
    }

}

</style></head><body><!-- LOADING SCREEN --><div id="loader"><div class="loader-circle"></div>

<div class="loader-text">
    <div class="zbs">ZBS</div>
    <div class="gold">GOLD</div>
</div>

<!-- LOADING BAR -->

<div class="loader-bottom">

    <div class="loader-label">
        PARTS AND ACCESSORIES
    </div>

    <div class="loader-bar">
        <div class="loader-progress"></div>
    </div>

</div>

</div><!-- MAIN PAGE --><div class="page"><!-- Header -->

<header class="header">

    <div class="brand">ZBS</div>

    <div class="gold-text">GOLD</div>

    <div class="tagline">
        PARTS AND ACCESSORIES
    </div>

</header>

<!-- Main content -->

<main class="content">

    <div class="message-box">

        <div class="message">
            ZBS کی جینین وائیرنگ<br>
            استعمال کرنے کا<br>
            شکریہ۔
        </div>

        <img
            class="logo"
            src="https://github.com/ZBSGOLD/Wiring/raw/refs/heads/main/1000674931-removebg-preview.png"
            alt="ZBS GOLD Product Logo"
        >

        <div class="divider"></div>

    </div>

</main>

<!-- Footer -->

<footer class="footer">

    <div>ZBS GOLD • PARTS AND ACCESSORIES</div>

    <div class="product-line">
        The Product Of ZBS
    </div>

</footer>

</div><!-- LOADING SCRIPT --><script>

window.addEventListener("load", async function () {

    const startTime = Date.now();

    // Wait for fonts

    if (document.fonts) {
        await document.fonts.ready;
    }

    // Ensure minimum 3 seconds loading

    const elapsed = Date.now() - startTime;
    const remaining = Math.max(0, 3000 - elapsed);

    setTimeout(function () {

        document.getElementById("loader").classList.add("hide");

    }, remaining);

});

</script></body>
</html>
